name: motor-atlas

x-database-url: &database-url "postgresql://automotive:${POSTGRES_PASSWORD:-automotive_local}@postgres:5432/automotive"

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: automotive
      POSTGRES_USER: automotive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-automotive_local}
      # PostgreSQL18 usa um diretório versionado sob /var/lib/postgresql.
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  etl:
    image: motor-atlas-etl:1.0.0
    build:
      context: .
      dockerfile: etl/Dockerfile
    environment:
      DATABASE_URL: *database-url
      SPARK_MASTER: local[2]
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
      SPARK_LOCAL_IP: 127.0.0.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - bronze_data:/app/data/bronze
      - silver_data:/app/data/silver
      - analytics_data:/app/data/analytics
      - quarantine_data:/app/data/quarantine
      - ./docs:/app/docs
    restart: "no"

  api:
    image: motor-atlas-api:1.0.0
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: *database-url
      CORS_ORIGINS: http://localhost:3100,http://127.0.0.1:3100
    ports:
      - "127.0.0.1:${API_PORT:-8100}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      etl:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: motor-atlas-web:1.0.0
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  analysis:
    image: motor-atlas-etl:1.0.0
    profiles: [reports]
    environment:
      DATABASE_URL: *database-url
    command: ["python", "notebooks/analise.py", "--pais", "BR", "--origem", "real", "--ano", "2025"]
    volumes:
      - ./notebooks/resultados:/app/notebooks/resultados
    depends_on:
      postgres:
        condition: service_healthy
      etl:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres_data:
  bronze_data:
  silver_data:
  analytics_data:
  quarantine_data:
